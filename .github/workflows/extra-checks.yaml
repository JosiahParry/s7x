on:
  push:
    branches: [main, master]
  pull_request:

name: extra-checks.yaml

permissions: read-all

jobs:
  urls:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::urlchecker

      - name: Check URLs
        shell: Rscript {0}
        run: |
          res <- urlchecker::url_check()
          print(res)
          if (nrow(res) > 0) stop("Found ", nrow(res), " broken URL(s).")

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - name: Check every topic has an example
        shell: Rscript {0}
        run: |
          rd_files <- list.files("man", pattern = "\\.Rd$", full.names = TRUE)
          missing <- Filter(function(f) {
            rd <- readLines(f)
            skip <- any(grepl("\\\\docType\\{package\\}|\\\\keyword\\{internal\\}", rd))
            !skip && !any(grepl("^\\\\examples", rd))
          }, rd_files)
          if (length(missing) > 0) {
            stop("Missing examples:\n", paste(basename(missing), collapse = "\n"))
          }
