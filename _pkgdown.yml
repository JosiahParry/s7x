url: https://s7x.josiah.rs/
repo:
  url:
    home: https://github.com/JosiahParry/s7x
    source: https://github.com/JosiahParry/s7x/blob/main/
    issue: https://github.com/JosiahParry/s7x/issues/
    user: https://github.com/
template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#974ba8"
    bg: "#ffffff"
    fg: "#1f131a"
    navbar-light-bg: "#f8f4f6"
    navbar-dark-bg: "#0e080d"
    enable-rounded: false

reference:
  - title: Enumerations
    desc: A scalar value drawn from a fixed set of variants.
    contents:
      - Enum
      - new_enum
      - property_enum
      - enum_roclet

  - title: Scalar properties
    desc: Properties constrained to a single atomic value.
    contents:
      - property_scalar
      - class_string
      - class_integer
      - class_double
      - class_boolean

  - title: Range properties
    desc: Scalar properties bound to an inclusive numeric range.
    contents:
      - property_range
      - property_range_discrete

  - title: Combinators
    desc: Combine classes and properties with OR/AND semantics.
    contents:
      - property_union
      - property_intersection

  - title: Coercion
    desc: Coerce S7 objects to plain R vectors or JSON.
    contents:
      - as_vector
      - to_json
